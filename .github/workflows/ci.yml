name: CI

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcups2-dev libusb-1.0-0-dev cups cups-filters ghostscript python3
      - name: Build
        run: make
      - name: Offline tests
        run: make check

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel cups cups-filters ghostscript python libusb git
      - uses: actions/checkout@v7
      - name: Build
        run: make
      - name: Offline tests
        run: make check
      - name: Package install into a staging root
        run: make DESTDIR=/tmp/stage install && find /tmp/stage -type f | head -20

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Core tests
        run: ./gradlew --no-daemon :core:test
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ivec-print-apk
          path: android/app/build/outputs/apk/debug/*.apk
